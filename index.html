<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fieldnotes — a private journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
</head>
<body>

<!-- ================= Auth screen ================= -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h1>Fieldnotes</h1>
    <div class="sub" id="authSub">Sign in to your journal</div>
    <div class="auth-error" id="authError"></div>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" autocomplete="current-password" required minlength="8">
      </div>
      <button type="submit" class="auth-submit" id="authSubmit">Sign in</button>
    </form>
    <div class="auth-switch">
      <span id="authSwitchText">New here?</span>
      <button type="button" id="authSwitchBtn">Create an account</button>
    </div>
  </div>
</div>

<!-- ================= App ================= -->
<div class="app hidden" id="appRoot">
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle entry list">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div>
        <h1>Fieldnotes</h1>
        <div class="sub" id="userEmailLabel"></div>
      </div>
      <div class="brand-actions">
        <button class="ghost-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="ghost-btn" id="logoutBtn" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="sidebar-controls">
      <div class="row-2">
        <button class="new-entry-btn" id="newEntryBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New entry
        </button>
        <button class="calendar-toggle-btn" id="calendarBtn" title="Calendar view" aria-label="Open calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--bone-dim)" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search entries…" autocomplete="off">
      </div>
      <div class="tag-filter" id="tagFilter"></div>
    </div>

    <div class="date-filter-banner hidden" id="dateFilterBanner">
      <span id="dateFilterLabel"></span>
      <button id="clearDateFilter" aria-label="Clear date filter">×</button>
    </div>

    <div class="entry-list" id="entryList"></div>

    <div class="sidebar-footer">
      <span class="count" id="entryCount">0 entries</span>
      <button class="export-btn" id="exportBtn">Export all</button>
    </div>
  </aside>

  <main class="desk" id="desk">
    <div class="page" id="page"></div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
